<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>doyungo host</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a href="/" class="logo">doyungo<b>.host</b></a>
  <span id="status" class="status-pill">연결 확인 중</span>
  <button id="logoutBtn" class="ghost sm hidden" type="button">로그아웃</button>
</header>

<main>
  <!-- 로그인 -->
  <section id="loginBox" class="login">
    <h1>내 사이트를 올리고,<br>바로 주소를 받으세요.</h1>
    <p class="muted">HTML 파일이나 ZIP을 올리면 <code>doyungo.com/이름</code> 주소로 공개됩니다.</p>
    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="email">이메일</button>
      <button type="button" class="tab" data-tab="phone">전화번호</button>
      <button type="button" class="tab" data-tab="google">Google</button>
    </div>
    <div class="tab-pane" id="pane-email">
      <input id="email" type="email" placeholder="이메일" autocomplete="email">
      <input id="password" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
      <div class="row"><button id="emailLoginBtn" class="primary grow">로그인</button><button id="emailSignupBtn" class="secondary grow">회원가입</button></div>
      <button id="resetBtn" class="ghost sm" type="button">비밀번호 재설정</button>
    </div>
    <div class="tab-pane hidden" id="pane-phone">
      <input id="phone" type="tel" placeholder="전화번호 (예: 010-1234-5678)" autocomplete="tel">
      <button id="sendCodeBtn" class="primary block">인증번호 받기</button>
      <div id="codeBox" class="hidden">
        <input id="code" inputmode="numeric" maxlength="6" placeholder="인증번호 6자리" autocomplete="one-time-code">
        <button id="verifyCodeBtn" class="primary block">인증하고 로그인</button>
      </div>
      <div id="recaptcha"></div>
    </div>
    <div class="tab-pane hidden" id="pane-google"><button id="googleBtn" class="primary block">Google로 계속하기</button></div>
    <p id="loginMsg" class="msg"></p>
    <div class="admin-area">
      <button type="button" id="adminToggle" class="ghost sm">관리자</button>
      <div id="adminBox" class="hidden">
        <input id="adminPassword" type="password" placeholder="관리자 비밀번호" autocomplete="current-password">
        <button id="adminLoginBtn" class="primary block">관리자 로그인</button>
        <p id="adminMsg" class="msg"></p>
      </div>
    </div>
  </section>

  <!-- 콘솔 -->
  <div id="app" class="shell hidden" data-view="sites">
    <section id="sites" class="pane pane-sites">
      <div class="pane-head"><h2>내 사이트</h2><div class="row"><button id="refreshBtn" class="ghost sm" type="button">새로고침</button><button id="createBtn" class="primary sm" type="button">＋ 새 사이트</button></div></div>
      <div id="sitesList" class="sites-list"><div class="empty">불러오는 중…</div></div>
    </section>

    <section id="editor" class="pane pane-editor">
      <div class="pane-head"><div><small id="builderEyebrow">새 사이트</small><h2 id="builderTitle">새 사이트 만들기</h2></div></div>
      <div id="editBanner" class="edit-banner hidden"><span><b id="editSlug"></b> 편집 중 · 주소는 고정돼요</span><a id="editLink" href="#" target="_blank" rel="noopener">열기 ↗</a></div>
      <div class="fields">
        <div><label for="slug">사이트 주소</label><div class="url-input"><span>doyungo.com/</span><input id="slug" placeholder="my-site" maxlength="40" autocapitalize="none" autocorrect="off"></div></div>
        <div><label for="title">제목</label><input id="title" placeholder="내 사이트"></div>
      </div>
      <div class="upload">
        <label class="file-pick" for="zipInput">ZIP 프로젝트 올리기</label><input id="zipInput" type="file" accept=".zip,application/zip" hidden>
        <small>HTML·CSS·JS·이미지·폰트, 폴더 구조 그대로 · 아래에 코드를 직접 써도 돼요</small>
      </div>
      <div class="workspace">
        <aside class="files">
          <div class="files-head"><span>파일 <b id="fileCount">1</b></span><div class="file-tools"><button type="button" id="addFileBtn">＋ 파일</button><button type="button" id="deleteFileBtn">삭제</button><button type="button" id="downloadZipBtn">⬇ ZIP</button></div></div>
          <div id="fileTree"></div>
        </aside>
        <div class="code">
          <div class="code-head"><span><span id="activeFileName">index.html</span> <span id="dirtyDot" class="dirty hidden">● 수정됨</span></span><button type="button" id="saveFileBtn" class="secondary sm">파일 저장</button></div>
          <div id="imgPreview" class="img-preview hidden"></div>
          <label for="htmlCode" class="sr-only">파일 코드</label>
          <textarea id="htmlCode" spellcheck="false" autocapitalize="none" autocorrect="off"></textarea>
        </div>
      </div>
      <div class="actions">
        <span id="unsavedCount" class="unsaved"></span>
        <button id="previewBtn" class="secondary" type="button">미리보기</button>
        <button id="newBtn" class="ghost" type="button">초기화</button>
        <button id="saveBtn" class="primary grow">사이트 배포</button>
      </div>
    </section>

    <section id="preview" class="pane pane-preview">
      <div class="pane-head"><h2>미리보기</h2><button id="refreshPreview" class="ghost sm" type="button">새로고침</button></div>
      <iframe id="previewFrame" title="미리보기" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
    </section>

    <nav class="tabbar" aria-label="화면 전환">
      <button type="button" data-view="sites" class="on">사이트</button>
      <button type="button" data-view="editor">편집</button>
      <button type="button" data-view="preview">미리보기</button>
    </nav>
  </div>
</main>

<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
