<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOYUN HOST</title><link rel="stylesheet" href="style.css"></head>
<body><main class="glass"><div class="top"><div><div class="logo">DOYUN HOST</div><h1>HTML 호스팅</h1><p>HTML을 저장하면 <b>doyungo.com/원하는이름</b>으로 공개됩니다.</p></div><span id="status" class="pill">확인 중</span></div>
<section id="loginBox" class="card"><h2>관리자 로그인</h2><input id="password" type="password" placeholder="관리자 비밀번호"><button id="loginBtn">로그인</button><p id="loginMsg" class="msg"></p></section>
<section id="app" class="hidden"><div class="card"><div class="grid"><div><label>사이트 이름</label><input id="slug" placeholder="예: test-site" maxlength="40"></div><div><label>HTML 제목</label><input id="title" placeholder="내 사이트"></div></div><label>HTML 코드</label><textarea id="htmlCode" spellcheck="false"><!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 사이트</title></head><body><h1>안녕하세요 👋</h1><p>DOYUN HOST로 만든 사이트입니다.</p></body></html></textarea><div class="buttons"><button id="previewBtn" class="secondary">미리보기</button><button id="saveBtn">공개 URL 만들기</button><button id="logoutBtn" class="ghost">로그아웃</button></div></div>
<div class="card"><h2>미리보기</h2><iframe id="preview" sandbox="allow-scripts allow-forms allow-modals"></iframe></div>
<div class="card"><div class="row"><h2>내 사이트</h2><button id="refreshBtn" class="secondary small">새로고침</button></div><div id="sites" class="sites"></div></div></section></main><script src="script.js"></script></body></html>
